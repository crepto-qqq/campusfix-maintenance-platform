<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CampusFix</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/theme.css?v=20261019-closeout">
    <script src="./js/background.js?v=20261005" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>CampusFix</h1>

      <section>
        <h2>Create an account</h2>

        <form id="registration-form">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" maxlength="100" required>

          <label for="email">Email</label>
          <input id="email" name="email" type="email" maxlength="255" required>

          <div class="verification-code-row">
            <div>
              <label for="verification-code">Email verification code</label>
              <input
                id="verification-code"
                name="verificationCode"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                minlength="6"
                maxlength="6"
                pattern="[0-9]{6}"
                required>
            </div>
            <button id="send-verification-code" type="button">Send code</button>
          </div>
          <p id="verification-message" class="field-help" role="status"></p>

          <p class="field-help">Public registration creates a Student account with Requester access. Staff identity and operational roles are assigned by an administrator.</p>

          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="8" maxlength="72" required>

          <button type="submit">Register</button>
          <p id="registration-message" role="status"></p>
        </form>

        <p>Already have an account? <a href="./index.html">Back to login</a></p>
      </section>
    </main>

    <script src="./js/app.js?v=20261019-closeout"></script>
  </body>
</html>
