<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusFix</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <main class="container">
      <h1>CampusFix</h1>

      <section>
        <h2>Login</h2>

        <form id="login-form">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" maxlength="255" required>

          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" minlength="8" maxlength="72" required>

          <button type="submit">Login</button>
        </form>

        <p>Don't have an account? <a href="./register.html">Create an account</a></p>
        <button id="logout-button" type="button" hidden>Logout</button>
        <p id="auth-message" role="status"></p>
      </section>
    </main>

    <script src="./js/app.js"></script>
  </body>
</html>
