spring.application.name=campusfix-api
# Load the team's ignored local configuration whether the app is launched from
# the repository root or from backend/. Environment variables still override it.
spring.config.import=optional:file:.env.local[.properties],optional:file:backend/.env.local[.properties]
campusfix.bootstrap-admin.password=${CAMPUSFIX_ADMIN_PASSWORD:}
campusfix.registration.email-verification.required=${CAMPUSFIX_EMAIL_VERIFICATION_REQUIRED:true}
campusfix.registration.email-verification.code-ttl=10m
campusfix.registration.email-verification.resend-cooldown=60s
campusfix.registration.email-verification.max-failed-attempts=5
campusfix.email.brevo.api-key=${CAMPUSFIX_BREVO_API_KEY:}
campusfix.email.brevo.sender-name=${CAMPUSFIX_EMAIL_FROM_NAME:CampusFix}
campusfix.email.brevo.sender-email=${CAMPUSFIX_EMAIL_FROM_ADDRESS:}
# BackendApplication pins H2 to the repository-level data/campusfix path.
# Never use a working-directory-relative database URL here.
spring.datasource.url=${CAMPUSFIX_DATABASE_URL}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
