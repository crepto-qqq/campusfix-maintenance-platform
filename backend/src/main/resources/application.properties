spring.application.name=campusfix-api
campusfix.bootstrap-admin.password=${CAMPUSFIX_ADMIN_PASSWORD:}
# BackendApplication pins H2 to the repository-level data/campusfix path.
# Never use a working-directory-relative database URL here.
spring.datasource.url=${CAMPUSFIX_DATABASE_URL}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
